<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit.Com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Blinkit</div>
        <div class="location">
            <h3>Delivery in 10 minutes</h3>
            <p>Meerut, Uttar Pradesh</p>
        </div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search for product">
        </div>
        <div class="button">
            <button class="login">Login</button>
            <button class="cart">My Cart</button>
        </div>
    </header>

    <hr>

    <section class="banner">

        <div class="banner-text">
            <h1>Stock up on daily essentials</h1>

            <p>
                Get fresh fruits, vegetables, snacks and
                daily essentials delivered right to your doorstep.
            </p>

            <button class="shop">
                Shop Now →
            </button>
        </div>


    </section>



    


</body>
</html>
